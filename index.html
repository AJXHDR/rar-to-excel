<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAR to Excel Converter</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- PapaParse for CSV -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <!-- SheetJS for Excel -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-6 font-sans">

  <main class="w-full max-w-xl bg-slate-800 border border-slate-700 rounded-xl p-8 shadow-2xl">
    <header class="text-center mb-8">
      <h1 class="text-3xl font-bold text-white mb-2">RAR to Excel Extractor</h1>
      <p class="text-slate-400 text-sm">Upload a .rar archive containing a pipe-separated (|) CSV file.</p>
    </header>

    <!-- File Drop Zone -->
    <section id="drop-zone" class="border-2 border-dashed border-slate-600 hover:border-indigo-500 rounded-lg p-8 text-center cursor-pointer transition-colors bg-slate-800/50">
      <input type="file" id="file-input" accept=".rar" class="hidden" />
      <div class="flex flex-col items-center gap-3">
        <svg class="w-12 h-12 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
        </svg>
        <p class="text-base font-medium text-slate-200">Drag & drop your .rar file here, or <span class="text-indigo-400 underline">browse</span></p>
        <p class="text-xs text-slate-500">Supports .rar archives</p>
      </div>
    </section>

    <!-- File Info & Action -->
    <section id="file-info" class="mt-6 hidden">
      <div class="flex items-center justify-between p-4 bg-slate-700/50 rounded-lg border border-slate-600">
        <div class="flex items-center space-x-3 overflow-hidden">
          <svg class="w-8 h-8 text-indigo-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
          </svg>
          <div class="truncate">
            <p id="file-name" class="text-sm font-semibold text-slate-200 truncate">filename.rar</p>
            <p id="file-size" class="text-xs text-slate-400">0 KB</p>
          </div>
        </div>
        <button id="convert-btn" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-5 py-2.5 rounded-lg transition-colors text-sm shrink-0">
          Convert & Download
        </button>
      </div>
    </section>

    <!-- Status / Progress -->
    <div id="status-container" class="mt-4 hidden">
      <p id="status-text" class="text-xs text-indigo-400 font-medium text-center animate-pulse">Processing archive...</p>
    </div>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
